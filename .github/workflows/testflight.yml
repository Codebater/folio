# Signed App Store build from GitHub's macOS runners (no Mac needed).
# Ported from the first Codex pipeline, which Apple accepted on 2026-11-01;
# see docs/TESTFLIGHT.md. Manual only. Upload happens only when the
# "upload" box is ticked.
name: Signed TestFlight build
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed IPA to App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: folio-testflight
  cancel-in-progress: false
jobs:
  distribute:
    runs-on: macos-15
    timeout-minutes: 45
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      CERTIFICATE_B64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.APPLE_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      # Our own Ivy-family voices live in a private repository; a read-only
      # deploy key (environment secret) copies them into the app. Without the
      # key the build goes on without them.
      - name: Add our voices
        env:
          VOICES_DEPLOY_KEY: ${{ secrets.VOICES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VOICES_DEPLOY_KEY" ]; then
            echo "::warning::No VOICES_DEPLOY_KEY: building without our own voices."
            exit 0
          fi
          KEY="$RUNNER_TEMP/voices_key"
          printf '%s\n' "$VOICES_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:Codebater/folio-voices.git "$RUNNER_TEMP/folio-voices"
          rm -f "$KEY"
          mkdir -p Apps/FolioiOS/Voices
          cp "$RUNNER_TEMP/folio-voices/styles/"*.json Apps/FolioiOS/Voices/
          rm -rf "$RUNNER_TEMP/folio-voices"
          echo "Voices: $(ls Apps/FolioiOS/Voices | tr '\n' ' ')"
      - name: Test and generate
        run: |
          set -euo pipefail
          test -n "$TEAM_ID" && test -n "$BUNDLE_ID" && test -n "$CERTIFICATE_B64" && test -n "$PROFILE_B64"
          swift test
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec Apps/FolioiOS/project.yml
      - name: Install signing material into temporary keychain
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/folio-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/export_options.py
      - name: Archive and export
        run: |
          set -euo pipefail
          xcodebuild archive -project Apps/FolioiOS/Folio.xcodeproj -scheme Folio -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Folio.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' FOLIO_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" -quiet
          xcodebuild -exportArchive -archivePath build/Folio.xcarchive -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la build/export
      - name: Check version and build number
        run: |
          set -euo pipefail
          unzip -p build/export/Folio.ipa 'Payload/Folio.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$RUNNER_TEMP/Info.plist")
          BUILD=$(plutil -extract CFBundleVersion raw "$RUNNER_TEMP/Info.plist")
          echo "Folio $VERSION ($BUILD)"
          echo "### Folio $VERSION ($BUILD)" >> "$GITHUB_STEP_SUMMARY"
          test "$BUILD" = "$GITHUB_RUN_NUMBER" || { echo "Build number $BUILD is not the run number $GITHUB_RUN_NUMBER"; exit 1; }
      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_B64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file build/export/Folio.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/folio-upload.log"
          python3 scripts/verify_upload.py "$RUNNER_TEMP/folio-upload.log"
      # The signed IPA is not kept as an artifact: on a public repository anyone could download it.
      - name: Remove credentials
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          if [ -n "${ASC_KEY_ID:-}" ]; then rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"; fi
